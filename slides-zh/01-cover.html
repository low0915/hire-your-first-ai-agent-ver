<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>封面 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.wrap { display:grid; grid-template-columns: 1fr 760px; align-items:center; height:100%; }
.display { font-size: 150px; margin: 26px 0 40px; }
.lead { max-width: 900px; }
.partner { position:absolute; left:128px; bottom:64px; display:flex; align-items:center; gap:28px; color: var(--on-dark-3); font-size: 24px; }
.partner img { height: 40px; } .partner img.sql { height: 30px; }
.hero { position:relative; width:760px; height:760px; display:grid; place-items:center; }
.hero svg.orbit { position:absolute; inset:0; }
.hero .av { width: 500px; height: 500px; position:relative; }
.ring { transform-origin: 380px 380px; animation: spin 60s linear infinite; }
.ring.b { animation-duration: 90s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="dark bare" data-section="公司介绍" data-sparks="6,1 9,2 8,5 5,4" style="--gx:72%;--gy:46%;--mx:72%;--my:50%">
<main class="slide">
<div class="wrap">
  <div>
    <div class="kicker r" style="--d:.2s;font-size:26px">SQL 讲座 · 所有合作伙伴与客户</div>
    <h1 class="display r" style="--d:.35s">聘请你的第一个<br> <span class="sig" style="--sd:1.3s">AI Agent</span></h1>
    <p class="lead r" style="--d:.6s">AI 需要什么、能做什么，你的公司该从哪里开始。</p>
  </div>
  <div class="hero">
    <svg class="orbit" viewBox="0 0 760 760" fill="none">
      <g class="ring"><circle cx="380" cy="380" r="340" stroke="rgba(242,251,247,.14)" stroke-dasharray="2 10"/><circle cx="380" cy="40" r="7" fill="#00F5A9"/></g>
      <g class="ring b"><circle cx="380" cy="380" r="290" stroke="rgba(0,245,169,.22)"/><circle cx="670" cy="380" r="5" fill="#00F5A9" opacity=".7"/></g>
    </svg>
    <img class="av pop" style="--d:.5s" src="../assets/av/agent-hi.svg" alt="SuDu AI Agent 在挥手">
  </div>
</div>
<div class="partner f" style="--d:1.1s"><img src="../assets/logo-white.png" alt="SuDu AI"><span>×</span><img class="sql" src="../assets/sql-h-white.png" alt="SQL Account"><span class="pill">官方合作伙伴</span></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
