 {
  "file": "slides-zh/09-ai-types.html",
  "label": "AI 的类型",
  "section": "什么是 AI Agent？",
  "notes": "“在打开大脑之前，先看 1 张小地图。大家讲 AI，好像它只是 1 样东西。其实不是。按它做什么来分，有 5 种。大部分你每天都在用。我带你看看在哪里。”\n\n（下一步）预测型 AI，背后是机器学习：“想成天气预报，只是预报你的销售。Grab 说司机 4 分钟到，银行发盗刷提醒，Shopee 帮你推荐商品，这些都是预测型 AI。它从过去的数字学习，猜出下一个：这里是 12 月，1,240 箱。在你公司：谁会迟付款，什么货快没了。它的限制：新产品没有历史数据。”\n\n（下一步）视觉 AI，背后是深度学习：“停车场你天天见。车开到闸口，摄像头读出 WXY 1234，查到是月票，闸门就开了。不用票，不用保安。刷脸解锁、Google Lens 也是一样的原理。在你公司：读手写订单或银行单据。车牌脏了、光线差，它可能读错。”\n\n（下一步）语音 AI：“Hey Siri、YouTube 自动字幕、跟你的车讲话。它把声音变成文字。客户发一条语音：Boss, esok hantar 10 carton Milo。它打成文字，变成一张订单。店里吵或口音重，有时会听错。”\n\n（下一步）Diffusion AI，背后是扩散模型：“你有没有在 TikTok 或 YouTube 上看过 AI 短剧？很多根本没有拍过。你打 1 句话：老板发现他的文员是 AI。它从一片噪点开始，就像电视的雪花，每一步清理一点。第 25 步，看得到城市了。第 50 步，完成：第 1 集。Midjourney 和 Sora 也是一样的原理。在你公司：产品照片和宣传视频，不用摄影棚。手、脸和文字还是可能出错，所以发布前先检查。”\n\n（下一步）AI Agent，就是 LLM 加上工具：“这一种直接把工作做完。1 张 WhatsApp 订单：它读订单、在 SQL Account 查库存、草拟 Sales Order，然后等你批准。AI Agent 把前面 4 种当成它的眼睛、耳朵和嘴巴。今天讲的就是它。”\n\n这一页多按 5 次 Next；每张卡片以 3D 飞进来，并播放它自己的小动画。\n下一页：“ChatGPT 和每一个 AI Agent 背后的大脑，就是 LLM。我们来打开看看。”",

 {
  "file": "slides-zh/10-how-much-it-read.html",
  "label": "AI 读了多少",
  "section": "什么是 AI Agent？",
  "notes": "“ChatGPT、Claude、Gemini、DeepSeek，这些名字大家都听过。它们里面都是同一样东西：LLM，大型语言模型。大型，是因为它用海量数据训练：网站、书本、新闻，100 多种语言。语言，是因为文字进去，文字出来。模型，是因为它学会了人写字的规律，所以能一个字一个字猜出下一个。它把文字切成小块来读，叫做 Token；1 个 Token 大约是四分之三个英文词。”\n\n（下一步）“猜一猜。为了学会语言，它读了多少？A，1 万本书。B，100 万本。C，2,000 万本。D，1 亿本。叠起来的话，A 是一栋 70 层高楼。B 是 6 座神山。C 超过太空站。D 比太空站高 6 倍。如果你一天读 1 本书，A 要 27 年，D 要 274,000 年。举手：A？B？C？D？”（数一数举手的人，再按 Next）\n\n（下一步）“谁选 D？还是不够。拿 DeepSeek V4 来说，2026 年的：大约 2.4 亿本 400 页的书，是 D 的 2 倍多。换成 Token，就是刚才说的那些小块文字，超过 32 万亿个。2 年前，Llama 3 读了 15 万亿，大概 1.1 亿本书，所以 2 年就翻了一倍。\n\n看好了，如果把这些书叠起来……”（书堆叠到双峰塔顶）“……这是 1 座双峰塔。继续。”（画面往后拉）“13,000 座双峰塔。这堆书大概 6,000 公里高，比太空站高 15 倍。平铺下来，这些书可以盖满 800 个足球场。”（画面换成地球和月球）“如果把每一页撕下来，首尾相接排好，可以到月球 50 趟。”\n\n备注：数字是根据公开的 Token 数粗略估算的（DeepSeek-V4 论文：32T+ Token；Meta：Llama 3，15T+）。算法：1 个 Token ≈ 0.75 个英文词；一本 400 页的书 = 100,000 个词，2.5 公分厚，书页 12 x 20 公分；一个足球场 = 7,140 平方米。讲的时候说“大概”。书堆本身没有到月球；是书页首尾相接才到。\n这一页多按 2 次 Next：先讲 LLM 是什么，再猜一猜（A 到 D，真正的答案比 D 还大），最后播 32 万亿的画面。\n下一页：“所以它是一个很聪明的大脑。但它能帮你做事吗？单靠它自己，不行。”",

  "file": "slides-zh/13-what-is-agent.html",

  "section": "什么是 AI Agent？",
  "notes": "“大脑单靠自己只会讲。所以，大家一步一步给它加东西：2023 年加上工具，2025 年开始有能自己做事的 AI Agent。如果 LLM 是大脑，那 AI Agent 就是有双手、也有限制的大脑。这里把它画成一个机器人，有 5 个部分。大脑单靠自己只会讲；它只能教你怎么做。把另外 4 个部分给它，它就帮你把事做完。我们一个一个来看。”\n\n（下一步）大脑：“头部就是语言模型。它看懂信息，计划下一步。它懂的是意思，不是关键词：bwg、bawang、onion 都是同一样东西。这里它读出是大洋葱、10 kg 装，也发现没写数量，所以它会问。但单靠它自己，它从来没见过你的公司。就像第 1 天上班、很聪明的毕业生。”\n\n（下一步）工具：“双手，也是大家最容易忘记的部分。每个工具是真实系统里的 1 个动作。有些工具只是看：查库存、读 Invoice。有些工具会动手：开订单、发信息。大脑自己按不了按钮。没有工具，它只能教你怎么做。没有工具，就做不了事。”\n\n（下一步）记忆：“胸口里的档案柜。大部分人不知道：每次聊完，大脑就什么都忘了。所以它要去你的记录里查：顾客、价格、库存，每次都查最新的。Jaya Grocer 上次的大洋葱价：每包 RM28。这也代表：记录乱，答案就错。”\n\n（下一步）规则与技能：“它手上的规则本。把你的做法写下来。规则讲的是什么绝对不能发生：超过信用额度，就停下来问老板。技能是做 1 件工作的步骤：读订单、对货品、查库存、起草、送去批准。用白话写，你的经理也能看、也能改。”\n\n（下一步）权限：“胸前的工作证，也是让它安全的关键。它能看什么？只看它工作需要的资料。它能做什么？只做你允许的：起草可以，删除不行，动钱绝对不行。重要的事都要等人来定，而且每个动作都有记录。帮手和风险的分别，就在这里。”\n\n（下一步）“把 5 个部分放在 1 张 WhatsApp 订单上：大脑读订单，记忆找出顾客和库存，工具在你的 ERP 起草订单，规则让它在货品不清楚时开口问，权限就是你批准了才会保存。”\n\n这一页多按 6 次 Next：5 个部分，再看 1 张订单。\n下一页：“但不是每个 AI Agent 都是好 AI Agent。来认识 2 位。”",

  "label": "从大脑到员工",
  "section": "什么是 AI Agent？",
  "notes": "“再聪明的大脑，单靠自己也只会讲。想想你请一个很优秀的毕业生：光有才华是不够的。你会给他 6 样东西，AI Agent 也需要同样这 6 样。\n\n[一行一行往下讲] 职位说明：对 AI 来说就是指示，目标是什么，怎样才算做完。没有它，它会做太多，或者做错工作。账号和钥匙：就是它的工具，每个动作 1 个。没有它们，它只能给建议。档案：就是它的记忆，你的记录，还有你教过它的东西。没有它，它会忘记顾客、乱猜价格。你的 SOP：就是它的规则与技能。没有它们，它就照自己的方式做事。主管：就是权限，谁来点头。没有它，库存或钱动之前，没人把关。还有试用期：就是测试。你先拿上个月的订单试，然后盯着它做。没有这一步，同一个错误会静静地一直重复。\n\n大脑加上这套配置，有个名字：harness，驾驭框架。每家公司都能租到同一个大脑。帮你还是害你，由 harness 决定。”\n\n下一页：“现在，请大家想象一件事。”",
  "thumb": "thumbs-zh/15-brain-to-staff.jpg"
 },
 {
  "file": "slides-zh/16-imagine.html",
  "label": "想象一下",
  "section": "SuDu AI",
  "notes": "（放慢速度，让全场去想象。）\n\n“请大家想象一件事。有一天，AI 能运营你的整家公司。\n\n今天，AI Agent 已经在管办公室：接订单、开发票、看库存、追款。刚才你已经看到是什么样子。\n\n下一步，AI 会走进车间。实体 AI：机器人在你的员工身边拣货、包装、组装。\n\n有一天，公司会自己运转。你定目标，其余交给 AI，而且重大决定前它还是会先问你。\n\n听起来很遥远？其实已经开始了。来看这个。”\n\n下一页：视频，F.03 在 BMW。",
  "thumb": "thumbs-zh/16-imagine.jpg"
 },

  "notes": "（视频播放：大约 1 分钟，Figure AI 的 F.03 机器人在 BMW 工厂车间工作。让它播完，不要边播边讲。）\n\n“这不是电影。这是真的机器人，在真的汽车工厂里，就在今天。”\n\n操作：点一下视频可以暂停或继续。如果开始时没有声音，点一下视频就会打开声音。\n下一页：“这就是世界要去的方向。而这正是 SuDu 在打造的。”",

 },
 {
  "file": "slides-zh/18-vision.html",
  "label": "我们的愿景",
  "section": "SuDu AI",
  "notes": "（让这句话停留一下。先停两秒再开口。）\n\n“SuDu 的愿景，是打造一个能自动化运营公司的 AI。不是聊天机器人，不是报表，而是一个运营公司的 AI。看这个球体：每一个点都是你公司里的一项工作。接单、采购、收货、存货、生产、出货、开单、收款，还有围绕它们的所有工作：报价、信用检查、拣货、打包、盘点、计划、品质检查、付款给供应商、做报表。每一项都连在一起，工作在上面自己不停地运转。\n\n这就是为什么 SuDu 是为此服务企业的 AI ERP：1 个系统管理所有流程，AI 负责执行、分析、提醒，人类负责决策。大部分软件只是在上面加 AI：旧系统旁边放一个聊天机器人，人还是要输入、点击、追。我们是为 AI 打造整个系统，所以它能读取每张订单、每次盘点、每笔付款，做决策、做事，重要的事由人来批准。最后一步是实体的：由同一个系统驱动的机器人，负责搬运、拣货和盘点。\n\n这就是我们的方向。现在让我给大家看看它今天的样子。”\n\n下一页：全景图。",
  "thumb": "thumbs-zh/18-vision.jpg"
 },
 {
  "file": "slides-zh/19-the-map.html",
  "label": "SuDu 全景图",
  "section": "SuDu AI",
  "notes": "“先看全貌，用大白话讲。\n\n这个大框就是 SuDu：1 个 ERP，1 个系统，1 个数据库。里面的工作从左流到右。供应链：卖和买，所以订单都在同一个地方。仓库，WMS：每一箱都扫描，所以库存准确。工厂，MES：每张工单都追踪，所以每张工单你都看得到。还有财务：所有东西都进到 SQL Account，所以你的账永远是最新的。\n\n左边，顾客和供应商照他们本来的方式联系你：WhatsApp 和 Email。上面一排，AI Agent 读取所有资料，在每一步做事。最下面是下一步：实体 AI，一辆自动驾驶货车和一个人形机器人，由同一个系统来管。\n\n看一张订单怎么走完全程。”（它会自己循环播放，大约 17 秒。）\n\n备注：实体 AI 是路线图，今天还没有在卖。\n下一页：“每家公司都在走同一条路。你的公司走到哪里了？”",
  "thumb": "thumbs-zh/19-the-map.jpg"
 },
 {
  "file": "slides-zh/20-five-stages.html",
  "label": "5 个阶段",
  "section": "SuDu AI",
  "notes": "“想想工业革命：蒸汽，然后是电，然后是电脑。每一次都改变了由谁来做工作，而先行动的工厂都赢了。公司的运营方式也一样。\n\n商业 1.0，大约到 1980 年：手写。订单写在簿子里，库存靠手点。很慢，也没人看得到全貌。\n\n商业 2.0，1980 和 1990 年代：电子表格。Excel 文件用 Email 传来传去。快了一些，但版本很多，常常打错。\n\n商业 3.0，从 1990 年代到现在：软件。SQL Account，加上每个部门各自一套系统。好很多，但系统之间不相通，人还是要把所有东西输入进去。今天在座大部分公司就在这里。\n\n商业 4.0 已经来了。ChatGPT 在 2022 年底出现，当时只会聊天。从 2025 年起，AI Agent 开始做事：读 WhatsApp 订单、开单据、追款，在 AI 原生 ERP 里面完成，由人来批准。这就是 SuDu 今天在做的，等一下的演示你会看到。\n\n接下来是商业 5.0：实体 AI。人形机器人和自动驾驶货车做体力活，由同一个系统驱动。AI 原生 ERP 加上机器人：自主运营的企业。\n\n（等竞争对手的标记往上爬时停一下。）重点是：未来不是快要来，而是已经来了。你的竞争对手可能已经在 4.0，而你还在 3.0。到目前为止的每一次革命，先行动的人都抢走了顾客。差距每年都在扩大。”\n\n指着每张卡上的两条柱：人手工作和成本每个时代都在下降，到 4.0 和 5.0 降得最多。\n备注：年份是大概的时代划分，不是精确日期；人手工作和成本的柱只是示意，不是实测数字。实体 AI 的时间（2020 年代后期）只是展望，目前还没有销售。\n下一页：“现在从侧面看看 SuDu 是怎么搭起来的。”",
  "thumb": "thumbs-zh/20-five-stages.jpg"
 },
 {
  "file": "slides-zh/21-layers-3d.html",
  "label": "3D 看 4 层",
  "section": "SuDu AI",
  "notes": "“这就是 SuDu 的结构，一层一层来看。先从地基开始：SQL Account。”\n\n（下一步：底板翻起来。）第 1 层，SQL Account：“你的会计。Invoice、Credit Note、付款、e-Invoice、税务、你的 P&L。它让你的账目正确，记录的是已经发生的事。SuDu 开出的每张单据都会自动进到这里。”\n\n（下一步：WMS 落在上面。）第 2 层，WMS：“上面是仓库。收货、上架、拣货、打包、送货、转仓、盘点、Batch 和有效期。每一箱一动就扫描，所以库存数字永远是真的。”\n\n（下一步：MES 落在上面。）第 3 层，MES：“如果你有生产，就是工厂。BOM、Production Order、发料、产出、QC、废料和机器时间。每张工单都实时计划、追踪和计算成本。”\n\n（下一步：AI Agent 落在最上面。）第 4 层，AI Agent：“最上面是 AI Agent，读取下面每一层，做日常工作。没有人批准，什么都不会存进去。”\n\n（下一步：四层合成一叠。）“4 层，1 个系统。每一层都建在下一层之上，由 AI 全部运营。”\n\n这一页有 5 次额外的“下一步”。\n下一页：“这就是 SuDu。现在来谈谈你。”",
  "steps": 5,
  "thumb": "thumbs-zh/21-layers-3d.jpg"
 },

  "notes": "“这就是 SuDu。现在来讲讲你：像你这样的企业每天遇到的问题。分 3 步。\n\n第一：你现在就用手机告诉我们你最大的问题。第二：我们最常听到的 5 大问题。第三：你算出它让你花了多少钱。”\n\n下一页：“拿出你的手机。”",

  "notes": "“请拿出手机扫一下这个。三个问题，一分钟。几分钟后，你们的答案就会出现在这个屏幕上。今天结束时，每个人都会带着写在面前作业纸上的三样东西离开：你的数字、你的准备度分数，还有你的第一个 AI 工作。”\n\n操作：教练帮忙不会扫码的人。演示操作员留意答案进来。\n表格：姓名、公司、手机；Q1 输入订单 / 追款 / 查库存 / 把纸本表格打进电脑 / 做报表；Q2 1 个人 / 2 到 3 个 / 4 个或以上；Q3（库存和财务数据）完全信任 / 大部分信任 / 不太信任；同意声明。\n下一页：“答案进来的同时，先看看我们最常听到的五个问题。”",

 {
  "file": "slides-zh/24-top-5-issues.html",
  "label": "5 大问题",
  "section": "问题",
  "notes": "“大家的答案还在进来，我先讲我们几乎每家公司都会听到的 5 个问题。\n\n第一：订单靠人手输入。每张 WhatsApp 和 Email 订单都要再打一次，要一整队人来做。\n\n第二：日常工作靠人做。追逾期款、发对账单、每天早上看同样的报表。\n\n第三：问题发现太迟。销售下跌、好顾客不再下单、库存断货，等到痛了才有人发现。\n\n第四：库存永远不准。系统写 40 箱，货架上只有 12 箱。\n\n第五：钱收得慢。送货后好几天才发 Invoice，银行单据还不知道丢在哪个聊天里。\n\n这 5 个里面中了至少 3 个的，请举手。”（停顿。）\n\n操作：让大家举手；这跟投票用数据要讲的是同一个重点。\n备注：问题 5 是我们的建议；如果投票结果显示别的，换成现场最多人选的答案。\n下一页：“我让你们看看问题一是怎么开始的。”",

 },
 {
  "file": "slides-zh/25-guess-the-order.html",
  "label": "猜猜这张订单",
  "section": "问题",
  "notes": "“这是一张真实的订单，来自真实的顾客聊天。跟你同桌的人一起看：这位顾客到底订了什么？给你们二十秒。”（停一下，让两桌回答。）\n\n（下一步：问号出现。）“China：是标题、品牌，还是洋葱的产地？Bwg besar，十公斤，乘以多少？几包？Ayam cincang，八 ekor，乘以多少？二十五 mil clear，一个：在你的系统里是哪个货品、哪个编号？还有十二点前送货：是哪一天？\n\n公司外面的人根本看不懂。但你公司里面有人在破解它，每张订单、每一天：打开聊天、猜、翻查上一张订单、找编号，然后打进 SQL Account。”\n\n（下一步：一张 PDF Purchase Order 滑进来。）“有些顾客比较整齐，他们发 PDF Purchase Order。好一点，但还是要有人把对方的货品编号对上你的，核对价格和单位，一包十个还是一个，然后逐行输入 SQL Account。接着是下一张 PO。”（这张 PO 是模拟的，名字都是虚构的。）\n\n这一页有 2 次额外的“下一步”：先是问题，然后是 PDF。\n下一页：“而同一张订单，还会被一打再打。”",

  "thumb": "thumbs-zh/25-guess-the-order.jpg"
 },
 {
  "file": "slides-zh/26-typed-three-times.html",
  "label": "人手输入",
  "section": "问题",
  "notes": "“跟着一张破解好的订单走一遍。它从 WhatsApp、PDF 或电话进来，一般的批发商每天大约 80 张。然后有人把它输入 SQL Account：新开 Sales Order、选顾客，然后一行一行、一栏一栏：货品编号、数量、单位、价格。每张大约 4 分钟。\n\n然后仓库需要 Picking List。订单已经在 SQL Account 里了，但很多公司还是有人把它再打一次进 Excel：货品、数量、哪个货架。打印、拣货、打包。又是 2 分钟。\n\n加起来：80 张订单乘 6 分钟，就是每天 8 小时。等于 1 个全职员工只在打字。而且同一张订单打了两次，就有 2 次机会打错编号，或者把 10 件看成 10 箱。\n\n你的账是对的；SQL Account 做好了它的工作。问题出在账目周围所有的打字工作。这不是谁的错，是工作本来就是这样安排的。”\n\n操作：讲到每张卡时就指着它。备注：80 张订单、4 分钟和 2 分钟只是例子；问问现场观众他们的数字。\n下一页：“第二个问题：日常工作。”",

 },
 {

  "notes": "“第二个问题。看看这张清单。查看谁逾期。在 WhatsApp 发十五条付款提醒。把银行单据对上 Invoice。发对账单。检查库存。整理销售报表。你办公室里每天都有人在做这些。到了明天，清单又从头开始。这些都不需要做决定，但全部都需要一个人，今天就要做。”\n\n下一页：“第三个问题更糟，因为你看不到它。”",

 {
  "file": "slides-zh/28-problem-3.html",
  "label": "问题 3：发现太迟",
  "section": "问题",
  "notes": "“问题三：问题发现得太迟。这是一个示例顾客。每个星期，九到十箱。然后订单越来越少，然后就停了。可能是竞争对手找上他了。办公室里没人发现，因为没有人每个星期盯着每一个顾客。七个星期后，有人问：Ah Seng 怎么了？那时候他已经走了。库存也一样：顾客打电话来，你才知道缺货了。销售也一样：要到月底报表你才看到下滑，那已经是开始下滑一个月之后了。”\n\n备注：这是示例数据，要讲明。\n下一页：“问题四：你的库存数字。”",
  "thumb": "thumbs-zh/28-problem-3.jpg"
 },
 {
  "file": "slides-zh/29-problem-4.html",
  "label": "问题 4：库存永远不准",
  "section": "问题",
  "notes": "“问题四：库存。SQL Account 写 40 箱。有人走去货架看：12 箱。另外 28 箱去哪里了？大部分仓库真正发生的是这样。\n\nManual Picking：拣货用纸，所以拿错货、拿错数量，也没人更新系统。没有固定货位，哪里有空位就放哪里，也没人记录放在哪个货架。所以货找不到：明明在仓库里，就是没人知道在哪里。最旧的货没有先出，旧箱子放在后面就过期了。UOM 混在一起：件数被打成箱数。而且什么都是隔天才输入。\n\n代价是什么？你答应给顾客你没有的货。过期货只能丢掉。员工花好几个小时找货。每到月底盘点，仓库就要停工一天。\n\n你的盘点从来对不上系统的，请举手。”（停顿。）“如果你不相信这个数字，你就不能让一个人，或者一个 AI，答应顾客有货。”\n\n下一页：“还有问题 5，最痛的那个：现金。”",

 },
 {

 {
  "file": "slides-zh/31-count-your-number.html",
  "label": "算出你自己的数字",
  "section": "问题",
  "notes": "“我们给这 5 个问题算一个数字，你自己的数字。三个步骤。\n\n第一步：你的团队每个星期花多少小时在人手工作上？所有员工加起来。我的例子：输入订单十个小时，追收款八个小时，查库存七个小时。一个星期二十五个小时。\n\n第二步：乘以一年五十二个星期。\n\n第三步：乘以十六令吉，大约是一个员工一小时的成本，包括 EPF 和 SOCSO。\n\n二十五乘五十二乘十六：一年两万零八百令吉，花在打单和追款上。现在把你每个月的人工 costing 大概算出来，写在笔记上。”\n\n操作：安静一分钟。教练帮忙算。\n备注：一小时 RM16 是一个月总成本大约 RM3,400 的员工，除以 208 个工作小时。按现场听众调整。\n下一页：“一般的做法是再请一个文员。但那只是让更多人做同样的打字工作。AI Agent 能解决吗？只要它有 1 样东西：工具。”",
  "thumb": "thumbs-zh/31-count-your-number.jpg"
 },
 {
  "file": "slides-zh/32-ai-guru.html",
  "label": "没有工具的 AI",
  "section": "问题",
  "notes": "“问大家一个问题。是不是使用了 AI 后，这些问题就能被解决？”（让大家回答；大部分人会说是）\n\n（下一步）“不一定。单靠 AI，只会想，不会做。”\n\n（下一步）“重点来了。没有工具的 AI，只是一位大师。你们都认识这种人：很有自信，建议很好听。你应该先查一下库存。你应该去追 Kedai Ali 的账。你应该打单快一点。谢谢你，大师。”（停一下）“中文有一句话专门讲这种人：只会讲，不会做。”（让大家笑）\n\n“AI 也一样。单靠它自己，只能想、只能给建议。要真的把事做完，它需要工具：伸进你生意里的一双手。这就是 SuDu 给它的。仓库用 WMS：扫码、盘点、拣货。工厂用 MES：追踪每一份工作、每一批货。全部建在 SQL Account 上，你的订单、发票和收付款本来就在那里。这样 AI 才会去查、去点、去打单、去追款，而你来批准。”\n\n这一页多按 2 次 Next：先问问题，再出“不一定”，最后是 AI 大师。\n下一页：“所以有了工具，工作方式就不一样了。”",

 {
  "file": "slides-zh/41-why-sudu.html",
  "label": "有了 SQL Account 为何还要 SuDu",
  "section": "SuDu AI",
  "notes": "（问题占满整个画面，让它停一下。）“我最常听到的问题是：我已经有 SQL Account 了，为什么还需要 SuDu？”（下一步：答案出现。）“问得好，因为 SQL Account 本身很好。我们把公司想成一层一层的。\n\n第一层，地基，是会计。SQL Account 管你的账：Invoice、付款、税务、报表。但请注意：它记录的是已经发生的事。\n\n第二层是仓库。仓库系统管现场：每一箱货到了就扫描，上架、拣货、出货。库存一动就马上记录，所以你的库存数字是真实、准确的。\n\n第三层，如果你有生产，就是工厂：MES，生产执行系统。它安排每张工单，按 BOM 发料，实时记录产量、废料和机器时间。所以任何时候你都看得到每张工单做到哪里、有没有延误、实际成本多少。不用再等明天的纸本记录表。每张工单你都看得到。\n\n第四层在最上面：AI Agent。它们读取这三层的所有数据，然后动手做事：接单、采购、追款、提早发现问题，由人来批准。SQL Account 告诉你已经发生了什么。SuDu 负责接下来要发生的事。”\n\n下一页：“那我可以自己把 ChatGPT 或 Claude 直接接到 SQL Account 吗？这是我每个星期都会被问到的问题。”",
  "steps": 1,
  "thumb": "thumbs-zh/41-why-sudu.jpg"
 },
 {
  "file": "slides-zh/42-plug-straight-in.html",
  "label": "为什么不直接接上去？",
  "section": "SuDu AI",
  "notes": "“每个星期都有人问我：我可以直接把 Claude 或 ChatGPT 接到我的 SQL Account 吗？可以。有 3 种做法，我们老实比一比。\n\n第 1 种：自己动手做。程序员把 Claude 直接接进数据库。它只在你开口问的时候才做事。它直接写进资料表，跳过 SQL Account 自己的检查，没有批准、没有记录，而且装在程序员的笔记本电脑上。你要付程序员的钱，再加 AI 订阅。\n\n第 2 种：用连接器。一个让 Claude 或 ChatGPT 跟 SQL Account 沟通的插件。这是正规的产品：它用 SQL Account 自己的登录，订单也要你批准。除了每日简报，它大多要有人开口问才做事。它只涵盖会计，而且要在 1 台一直开着的办公室电脑上运行。费用也会加起来：软件授权、AI 订阅，还常常要买额外的 SQL Account 用户授权，因为每个员工都要有自己的 SQL Account 登录。\n\n第 3 种：SuDu AI。AI 员工每天自己做事：追款、发报表、接订单。它遵守 SQL Account 的规则，所有东西都在批准队列里等你，而且都有记录。它涵盖会计、仓库和工厂。它在云端运行，网页、手机、WhatsApp 都能用。而且只有 1 个价钱，AI 全包。\n\nClaude 和 ChatGPT 是很好的大脑。用 SuDu，大脑、ERP 和 AI 员工，1 个价钱全部包含。”\n\n备注：保持公平，不要说出任何连接器产品的名字。Claude 是 Anthropic 做的，ChatGPT 是 OpenAI 做的。\n下一页：“我们再深入一层。”",
  "thumb": "thumbs-zh/42-plug-straight-in.jpg"
 },
 {
  "file": "slides-zh/43-plug-deep.html",
  "label": "深入比较：连接器 vs SuDu",
  "section": "SuDu AI",
  "notes": "“我们再深入一层，因为真正的分别在这里。连接器让你跟数据聊天，SuDu 帮你运营公司。6 件事。\n\nWhatsApp。连接器读不了 WhatsApp 群组，而且顾客的电话要跟 SQL Account 里的手机号码对得上，它才认得。SuDu 群组和私聊都会自己读，连没存的号码也行，还对得上顾客对货品的各种简称。\n\n订单。用连接器，员工还是要一张一张打单；顾客自助是另外收费的附加功能。在 SuDu，顾客在 WhatsApp 下单，就会变成 Sales Order 草稿，你只需要批准。\n\n跟进。连接器的定时信息发一次就结束：它不会等回复，顾客付款了也不会停。SuDu 正在推出可以跑好几天的任务：发出去、等回复、跟进，付款了就停。\n\n记忆。连接器每个问题都直接读取 SQL Account。SuDu 有记忆层：每位顾客的历史、习惯和以前的聊天，几百万条记录都记得。\n\n万一停机。连接器装在 1 台必须一直开着的 Windows 电脑上。所有东西在 1 个硬盘：没有备份，停了也没人知道。SuDu 在云端运行，有监控、有警报。而且 SuDu 正在把大问题搬到自己的数据平台上跑，让你用 Firebird 的 SQL Account 服务器，这个为记账设计的数据库，留给员工，保持快速。\n\n安装与使用。连接器要 IT 到现场，没有手机 App，管理页面只能在那台电脑打开，授权也绑定那台电脑。SuDu：网页或手机登录就能用，1 个账号管几家公司。”\n\n备注：数据平台和多天任务正在陆续上线；要说“正在搬”或“正在推出”，不要说“已经”。保持公平：不要说出任何连接器产品的名字。\n下一页：“所以 AI 底下需要有东西撑着。”",
  "thumb": "thumbs-zh/43-plug-deep.jpg"
 },
 {
  "file": "slides-zh/44-the-house.html",
  "label": "AI 底下需要什么",
  "section": "SuDu AI",
  "notes": "“AI 就像一栋房子。大多数人只看屋顶。AI 是最吸引人的部分。但屋顶下面要有房子，数据乱，AI 只会更快出错。所以要从地基盖起。每一层，我讲 1 个风险，再给你 1 个问题自己检查。\n\n1，地基：干净的数据。每样货 1 个编号、单位固定、库存和货架对得上，因为每一箱都扫描、每张工单都有记录。没有它，AI 会报错价格，答应给你没有的货。检查：盘点时，系统和货架对得上吗？\n\n2，门：安全的连接。AI 走一道受控的门，守住你的会计规则，绝不直接进数据库。没有它，1 个错误指令就能卡死服务器，或把你的账搞乱。检查：有没有工具直接写进你的 SQL 数据库？\n\n3，墙：权限与批准。谁能看什么、做什么、批准什么，每个动作都有记录。没有它，AI 什么都能改，也没人知道谁做了什么。检查：谁批准折扣、信用额度和采购，有没有写下来？\n\n4，屋顶：AI Agent 做日常工作。没有它，员工继续人手打单、人手追。检查：哪份工作每周最花时间？\n\n接下来，我让你们看整栋房子运作起来。”\n\n房子会从地面自己盖起来；编号圆点对应 4 层。这是第 2 条主线，后面还会再出现。\n下一页：“演示之前，先给大家看 1 张图，在座每一位 Admin 都会懂。”",

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", sans-serif; background: #000; }

  .overview { position: fixed; inset: 0; }
  body[data-mode="present"] .overview { display: none; }
  body[data-mode="present"] .start-btn { display: none; }

  body[data-ov="grid"]    #ov-gallery { display: none; }
  body[data-ov="gallery"] #ov-grid    { display: none; }
  body[data-ov="gallery"][data-mode="overview"] { background: #0a0805; }
  body[data-ov="grid"][data-mode="overview"]    { background: #E4EEE9; }

  /* ════════ 模式 1 · 自适应网格墙（一屏装得下→居中轻斜；装不下→舒适大小竖向滚动）════════ */
  #ov-grid { display: flex; justify-content: center; perspective: 2200px; perspective-origin: 50% 42%;
    background: radial-gradient(120% 90% at 50% 0%, #EEF5F1, #D9E6E0 75%); }
  body[data-grid="fit"]    #ov-grid { overflow: hidden;   align-items: center; }
  body[data-grid="scroll"] #ov-grid { overflow-y: auto; overflow-x: hidden; align-items: flex-start; padding: 74px 0 110px; }
  .wall-wrap { }
  body[data-grid="fit"]    .wall-wrap { transform: translateY(-3vh); }
  .wall { display: grid; gap: 20px; transform-origin: center center; margin: 0 auto; }  /* 不用 preserve-3d：整墙作单个倾斜平面，命中测试可靠 */
  #ov-grid .card {
    position: relative; aspect-ratio: 16/9; border-radius: 9px; overflow: hidden; background: #fff; cursor: pointer;
    box-shadow: 0 16px 34px rgba(40,34,24,0.20), 0 3px 10px rgba(40,34,24,0.12);
    transition: transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s;
  }
  #ov-grid .card:hover {
    transform: scale(1.18);
    box-shadow: 0 48px 92px rgba(40,34,24,0.36), 0 14px 30px rgba(40,34,24,0.22); z-index: 20;
  }

  /* ════════ 模式 2 · 无限画廊 ════════ */
  #ov-gallery { overflow: hidden; perspective: 2200px; perspective-origin: 50% 42%;
    background: radial-gradient(130% 120% at 50% 38%, #1b1610, #0a0805 82%); }
  .stage3d { --rx: 18; --rz: 9; position: absolute; inset: 0; transform-style: preserve-3d; transform: scale(1.22) rotateX(18deg) rotateZ(-9deg); transform-origin: center center; }
  .breathe { position: absolute; inset: 0; animation: breathe 26s ease-in-out infinite; transform-origin: center center; transform-style: preserve-3d; }
  .drift-layer { position: absolute; top: 0; left: 0; will-change: transform; animation: drift var(--driftSec, 80s) linear infinite; transform-style: preserve-3d; }
  #ov-gallery:hover .drift-layer { animation-play-state: paused; }
  .gallery { display: grid; }
  #ov-gallery .card {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer;
    box-shadow: 0 14px 30px rgba(0,0,0,0.42), 0 3px 9px rgba(0,0,0,0.3);
    transition: transform .34s cubic-bezier(.2,.7,.2,1), box-shadow .34s; transform-style: preserve-3d; will-change: transform;
  }
  #ov-gallery .card:hover {
    transform: translateZ(60px) rotateX(calc(var(--rx,18)*-1deg)) rotateZ(calc(var(--rz,9)*1deg)) scale(1.06);
    box-shadow: 0 30px 64px rgba(0,0,0,0.55), 0 8px 20px rgba(0,0,0,0.4); z-index: 30;
  }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 20; box-shadow: inset 0 0 240px 70px rgba(8,6,3,0.62); }
  @keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(calc(var(--dx)*-1), calc(var(--dy)*-1), 0); } }
  @keyframes breathe { 0%,100% { transform: scale(1.0); } 50% { transform: scale(1.045); } }

  /* 卡片通用内容 */
  .card .thumb { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; pointer-events: none; }
  .card .thumb iframe { width: 1920px; height: 1080px; border: 0; display: block; background: #fff; pointer-events: none; }
  .card .thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; background: #021A17; }
  .card .num { position: absolute; bottom: 6px; left: 7px; background: rgba(16,12,7,0.76); color: #fff; font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; z-index: 3; pointer-events: none; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ov-gallery .card .num { opacity: 0; transition: opacity .25s; }
  #ov-gallery .card:hover .num { opacity: 1; }

  .overview-title { position: fixed; top: 24px; left: 0; right: 0; text-align: center; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; z-index: 40; pointer-events: none; }
  body[data-ov="grid"]    .overview-title { color: #5a5346; opacity: 0.66; }
  body[data-ov="gallery"] .overview-title { color: rgba(244,238,224,0.7); text-shadow: 0 2px 12px rgba(0,0,0,0.6); }

  .start-btn { position: fixed; bottom: 26px; right: 26px; border: 0; padding: 13px 24px; border-radius: 999px; font-size: 15px; font-family: inherit; letter-spacing: 0.04em; cursor: pointer; z-index: 200; transition: transform .18s, box-shadow .18s; }
  body[data-ov="grid"]    .start-btn { background: #1a1712; color: #fff; box-shadow: 0 8px 28px rgba(40,34,24,0.28); }
  body[data-ov="gallery"] .start-btn { background: #f4eee0; color: #1a1712; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .start-btn:hover { transform: translateY(-2px); }

  /* ════════ 演示模式 ════════ */
  #stage { position: fixed; top: 50%; left: 50%; transform-origin: top left; will-change: transform; background: #021A17; box-shadow: 0 10px 60px rgba(0,0,0,0.4); overflow: hidden; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #021A17; opacity: 0; transition: opacity .35s ease; }
  #stage iframe.live { opacity: 1; z-index: 1; }
  #stage iframe.prev { opacity: 1; z-index: 0; transition: none; }
  /* zoom transition: overview map <-> detail map */
  #stage iframe.zout { z-index: 2; animation: zout .9s cubic-bezier(.55,0,.25,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zin  { animation: zin .9s cubic-bezier(.2,.7,.2,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zback { z-index: 2; animation: zback .8s cubic-bezier(.55,0,.25,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zret  { animation: zret .8s cubic-bezier(.2,.7,.2,1) forwards; transform-origin: 62% 55%; }
  @keyframes zout  { from { transform: scale(1); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes zin   { from { transform: scale(.88); opacity: 0; } 35% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  @keyframes zback { from { transform: scale(1); opacity: 1; } to { transform: scale(.85); opacity: 0; } }
  @keyframes zret  { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .counter { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; z-index: 100; opacity: 0.7; }
  .counter .label { color: rgba(255,255,255,0.7); margin-left: 8px; }
  .overview-btn { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85); border: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-family: inherit; cursor: pointer; z-index: 100; opacity: 0.6; }
  .overview-btn:hover { opacity: 1; }
  .nav-zone { position: fixed; top: 0; bottom: 0; width: 15%; cursor: pointer; z-index: 50; }
  .nav-zone.left { left: 0; } .nav-zone.right { right: 0; }
  .nav-hint { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 22px; opacity: 0; transition: opacity .2s; }
  .nav-zone.left .nav-hint { left: 20px; } .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    body[data-mode] .overview { display: none !important; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone, .overview-btn, .start-btn { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe { width: 1920px; height: 1080px; page-break-after: always; display: block; }
  }

  /* SuDu additions: progress hairline, speaker notes, quiet chrome */
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: #00F5A9; box-shadow: 0 0 10px rgba(0,245,169,.7); z-index: 120; transition: width .5s cubic-bezier(.16,1,.3,1); }
  body[data-mode="overview"] #progress { display: none; }
  #present-ui .counter, #present-ui .overview-btn { transition: opacity .4s; }
  body.idle #present-ui .counter, body.idle #present-ui .overview-btn { opacity: 0; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; overflow: auto; background: rgba(2,26,23,.94); color: #E8F5EF; z-index: 150;
    padding: 22px 32px 26px; font: 17px/1.55 -apple-system, "Helvetica Neue", sans-serif; white-space: pre-wrap; transform: translateY(100%); transition: transform .35s cubic-bezier(.16,1,.3,1);
    border-top: 2px solid #00F5A9; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #notes b { display: block; font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; color: #00F5A9; margin-bottom: 12px; text-transform: uppercase; }

  @media print { #progress, #notes { display: none !important; } }
</style>

</div>

  <div class="stage3d"><div class="breathe"><div class="drift-layer" id="driftLayer"><div class="gallery" id="gallery"></div></div></div></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const CARD_W = window.GALLERY_CARD_W || 300;
  const DRIFT_SEC = window.GALLERY_DRIFT_SECONDS || 80;
  const stage = document.getElementById('stage');
  const frames = [document.getElementById('frame'), document.getElementById('frame2')];
  let liveF = 0, wantFile = null;
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const wall = document.getElementById('wall');
  const gallery = document.getElementById('gallery');
  const driftLayer = document.getElementById('driftLayer');
  const storageKey = 'deck-index-' + location.pathname;
  let current = 0;

  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  driftLayer.style.setProperty('--driftSec', DRIFT_SEC + 's');

  // 概览模式：URL ?ov= > window.DECK_OVERVIEW > 随机(秒%5==0 → 20% 画廊)
  const qp = new URLSearchParams(location.search).get('ov');
  // 用户未指定时按秒数随机：网格(iframe 真页面) 60% / 无限画廊(图片缩略图) 40%。可用 ?ov=grid|gallery 或 window.DECK_OVERVIEW 固定。
  const OVERVIEW = qp || window.DECK_OVERVIEW || ((new Date().getSeconds() % 5 < 2) ? 'gallery' : 'grid');
  document.body.setAttribute('data-ov', OVERVIEW === 'gallery' ? 'gallery' : 'grid');

  function setMode(mode) {
    document.body.setAttribute('data-mode', mode);
    if (mode === 'present') { fit(); show(current); }
    else { requestAnimationFrame(buildOverview); }
  }

  /* ─ 媒体（缩略图优先，否则 iframe） ─ */
  function makeCard(idx, useScale, useImg) {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.idx = idx;
    const item = deck[idx];
    if (useImg && item.thumb) {
      // 仅画廊用：预渲染缩略图，扛无限平铺的性能
      const im = document.createElement('img');
      im.className = 'thumb-img'; im.src = item.thumb; im.decoding = 'async';
      card.appendChild(im);
    } else if (useImg) {
      // no picture yet: a plain title card. Never load many live slides at once (heavy, flickers)
      const ph = document.createElement('div');
      ph.className = 'thumb-img';
      ph.style.cssText = 'display:grid;place-items:center;padding:14px;text-align:center;color:#A9C4BA;font:600 15px/1.35 -apple-system,sans-serif';
      ph.textContent = item.label || ('Slide ' + (idx + 1));
      card.appendChild(ph);
    } else {
      // 网格默认用：真实 HTML 子页面（清晰、所见即所得）
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (useScale != null) thumb.style.transform = 'scale(' + useScale + ')';
      const ifr = document.createElement('iframe');
      ifr.src = item.file; ifr.setAttribute('scrolling', 'no');
      thumb.appendChild(ifr); card.appendChild(thumb);
    }
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = (idx + 1) + (item.label ? ' · ' + item.label : '');
    card.appendChild(num);
    card.addEventListener('click', () => { current = idx; setMode('present'); });
    return card;
  }

  function buildOverview() {
    if (document.body.getAttribute('data-mode') !== 'overview') return;
    if (OVERVIEW === 'gallery') buildGallery(); else buildGrid();
  }

  /* ════════ 网格墙（自适应） ════════ */
  function buildGrid() {
    const n = deck.length; if (!n) return;
    wall.innerHTML = '';
    for (let i = 0; i < n; i++) wall.appendChild(makeCard(i, null, true));  // thumbnails: no live slides in the overview
    layoutWall();
  }
  const GRID_PAD = 74;  // #ov-grid scroll 顶部 padding，算动态 transform-origin 用
  function layoutWall() {
    const n = deck.length; if (!n) return;
    const vw = innerWidth, vh = innerHeight, gap = 26;
    const availW = vw * 0.86;                                   // 留 rotateZ 横向余量（强对角也不裁切）
    const target = 280;
    let cols = Math.max(3, Math.min(9, Math.floor((availW + gap) / (target + gap))));
    cols = Math.min(cols, n);
    const rows = Math.ceil(n / cols);
    const cardW = Math.min(target + 40, (availW - (cols - 1) * gap) / cols);
    const cardH = cardW * 9 / 16;
    const baseW = cols * cardW + (cols - 1) * gap;
    const wallH = rows * cardH + (rows - 1) * gap;
    wall.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    wall.style.gap = gap + 'px';
    wall.style.width = baseW + 'px';
    // 单平面(无 preserve-3d)→任意角度都不重叠、可点；fit 与 scroll 都给强对角倾斜
    if (wallH <= vh * 0.80) {
      document.body.setAttribute('data-grid', 'fit');
      const rx = Math.max(11, Math.min(15, 15 - (rows - 2) * 1.1));
      const rz = Math.max(8, Math.min(11, 11 - (rows - 2) * 0.7));
      wall.style.setProperty('--rx', rx); wall.style.setProperty('--rz', rz);
      wall.style.transformOrigin = 'center center';
      const tilt = 'rotateX(' + rx + 'deg) rotateZ(-' + rz + 'deg)';
      wall.style.transform = tilt;
      const r = wall.getBoundingClientRect();
      let s = Math.min(vw * 0.92 / r.width, vh * 0.80 / r.height);
      s = Math.max(0.6, Math.min(s, 1.6));
      wall.style.transform = 'scale(' + s + ') ' + tilt;
    } else {
      // 多页：舒适大小竖向滚动 + 强对角倾斜；transform-origin 跟随滚动→消除高墙 rotateZ 把远端行甩出屏幕
      document.body.setAttribute('data-grid', 'scroll');
      wall.style.setProperty('--rx', 14); wall.style.setProperty('--rz', 7);
      wall.style.transform = 'rotateX(14deg) rotateZ(-7deg)';
      updateScrollOrigin();
    }
    wall.querySelectorAll('.card .thumb').forEach(t => { const c = t.parentElement; if (c.clientWidth) t.style.transform = 'scale(' + (c.clientWidth / W) + ')'; });
  }
  function updateScrollOrigin() {
    if (document.body.getAttribute('data-grid') !== 'scroll') return;
    const ovg = document.getElementById('ov-grid');
    wall.style.transformOrigin = '50% ' + (ovg.scrollTop + window.innerHeight / 2 - GRID_PAD) + 'px';
  }

  /* ════════ 无限画廊（洗牌不重复） ════════ */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffledRange(n, seed) { const rnd = mulberry32(seed); const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }

  function buildGallery() {
    const n = deck.length; if (!n) return;
    const vw = innerWidth, vh = innerHeight, gap = 18;
    const cardW = CARD_W, cardH = cardW * 9 / 16;
    const cellW = cardW + gap, cellH = cardH + gap;
    const visCols = Math.ceil(vw / cellW), visRows = Math.ceil(vh / cellH);
    // tile：宽够铺满；行数取「够铺满」与「装下全部 N 页」的较大者 → 看完所有页才重复
    const tileCols = visCols + 1;
    const tileRows = Math.max(visRows + 1, Math.ceil(n / tileCols));
    const tileCells = tileCols * tileRows;
    const perm = shuffledRange(n, 0x9e3779b9);        // 洗牌一次，打散规则感
    const tilePage = new Array(tileCells);
    for (let k = 0; k < tileCells; k++) tilePage[k] = perm[k % n];

    const cols = tileCols * 2, rows = tileRows * 2;    // 2× tile 保证无缝漂移
    driftLayer.style.setProperty('--dx', (tileCols * cellW) + 'px');
    driftLayer.style.setProperty('--dy', (tileRows * cellH) + 'px');
    gallery.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cardW + 'px)';
    gallery.style.gridAutoRows = cardH + 'px';
    gallery.style.gap = gap + 'px';
    gallery.innerHTML = '';
    const scale = cardW / W;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = tilePage[(r % tileRows) * tileCols + (c % tileCols)];
        gallery.appendChild(makeCard(idx, scale, true));  // 画廊 = 图片缩略图（性能）
      }
    }
  }

  /* ════════ 演示 ════════ */
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = 'translate(' + ((innerWidth - W * s) / 2) + 'px, ' + ((innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
    stage.style.top = '0'; stage.style.left = '0';
  }
  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    const fromIdx = current;
    current = idx;
    step = 0;
    // zoom between a slide and the one marked enter:'zoom' right after it
    const zoomIn = idx === fromIdx + 1 && deck[idx].enter === 'zoom';
    const zoomOut = idx === fromIdx - 1 && deck[fromIdx] && deck[fromIdx].enter === 'zoom';
    const file = deck[idx].file;
    if (frames[liveF].getAttribute('src') !== file && wantFile !== file) {
      wantFile = file;
      const back = frames[1 - liveF];
      back.onload = () => {
        if (wantFile !== file) return;            // a newer slide was asked for meanwhile
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const old = frames[liveF];
          const zo = zoomIn ? 'zout' : zoomOut ? 'zback' : '', zi = zoomIn ? 'zin' : zoomOut ? 'zret' : '';
          frames.forEach(f => f.classList.remove('zout', 'zin', 'zback', 'zret'));
          old.classList.add('prev'); old.classList.remove('live');
          if (zo) { old.classList.add(zo); back.classList.add(zi); }
          back.classList.add('live'); liveF = 1 - liveF; wantFile = null;
          if (document.activeElement === old) { old.blur(); window.focus(); }
          setTimeout(() => { old.classList.remove('prev', zo || 'x'); back.classList.remove(zi || 'x');
            if (!old.classList.contains('live')) old.src = 'about:blank'; }, zo ? 950 : 400);
        }));
      };
      back.src = file;
    }
    counter.innerHTML = (idx + 1) + ' / ' + deck.length + ' <span class="label">' + (deck[idx].label || '') + '</span>';
    document.getElementById('progress').style.width = ((idx + 1) / deck.length * 100) + '%';
    document.getElementById('notes').innerHTML = '<b>' + (idx + 1) + ' · ' + (deck[idx].section || '') + ' · ' + (deck[idx].label || '') + '</b>' + (deck[idx].notes || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) history.replaceState(null, '', '#' + (idx + 1));
  }
  // in-slide steps: a slide with "steps": N gets N extra Next presses before the deck moves on
  let step = 0;
  function liveFrame() { return frames.find(f => f.classList.contains('live')) || frames[0]; }
  function sendStep() { try { liveFrame().contentWindow.postMessage({ deckStep: step }, '*'); } catch (_) {} }
  function next() {
    const n = deck[current].steps || 0;
    if (step < n) { step++; sendStep(); return; }
    show(Math.min(current + 1, deck.length - 1));
  }
  function prev() {
    if (step > 0) { step--; sendStep(); return; }
    show(Math.max(current - 1, 0));
  }

  function handleKey(e) {
    if (e.key === 'n' || e.key === 'N') { document.body.classList.toggle('notes'); return; }
    if (e.key === 'g' || e.key === 'G') { setMode(document.body.getAttribute('data-mode') === 'present' ? 'overview' : 'present'); return; }
    if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); return; }
    if (e.key === 'Escape') { if (document.body.getAttribute('data-mode') === 'present') { e.preventDefault(); setMode('overview'); } return; }
    if (e.key === 'p' || e.key === 'P') { window.print(); return; }
    if (e.key === 'l' || e.key === 'L') { const zh = /(index-zh\.html|\/zh\/?)$/.test(location.pathname); const web = location.protocol !== 'file:'; location.href = (zh ? (web ? '/' : 'index.html') : (web ? '/zh' : 'index-zh.html')) + '#' + (current + 1); return; }
    if (document.body.getAttribute('data-mode') !== 'present') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); show(0); break;
      case 'End': e.preventDefault(); show(deck.length - 1); break;
      default: if (e.key >= '1' && e.key <= '9') { const i = parseInt(e.key, 10) - 1; if (i < deck.length) { e.preventDefault(); show(i); } }
    }
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    handleKey(e);
  });
  window.addEventListener('message', (m) => { if (m.data && m.data.deckKey) handleKey({ key: m.data.deckKey, preventDefault() {} }); });
  let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2200); };
  window.addEventListener('mousemove', wake); wake();
  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  document.getElementById('startBtn').addEventListener('click', () => setMode('present'));
  document.getElementById('overviewBtn').addEventListener('click', () => setMode('overview'));
  let rT;
  window.addEventListener('resize', () => { fit(); clearTimeout(rT); rT = setTimeout(() => { if (document.body.getAttribute('data-mode') === 'overview') { if (OVERVIEW === 'gallery') buildGallery(); else layoutWall(); } }, 140); });
  document.getElementById('ov-grid').addEventListener('scroll', updateScrollOrigin, { passive: true });
  window.addEventListener('hashchange', () => { const m = location.hash.match(/^#(\d+)$/); if (m) { current = parseInt(m[1], 10) - 1; setMode('present'); } });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else { try { const v = parseInt(localStorage.getItem(storageKey), 10); if (!isNaN(v) && v >= 0 && v < deck.length) current = v; } catch (_) {} }

  fit(); show(current);
  if (hashMatch) setMode('present'); else setMode('overview');



  window.addEventListener('beforeprint', () => { printStack.innerHTML = ''; deck.forEach(item => { const f = document.createElement('iframe'); f.src = item.file; printStack.appendChild(f); }); printStack.style.display = 'block'; stage.style.display = 'none'; });
  window.addEventListener('afterprint', () => { printStack.innerHTML = ''; printStack.style.display = 'none'; stage.style.display = ''; });
})();
</script>
</body>
</html>
