  "section": "What is an AI Agent?",
  "notes": "\"So what is AI, really? Forget the headlines. We will go in 3 steps.\n\nOne: the 5 types of AI you already use every day. Two: the brain, the thing people call an LLM, and how much it read. Three: the agent, a brain that can actually do the work.\"\n\nNext: \"First, the 5 types of AI you already use.\"",

 {
  "file": "slides/09-ai-types.html",
  "label": "Types of AI",
  "section": "What is an AI Agent?",
  "notes": "\"Before we open up the brain, 1 quick map. People say AI as if it is 1 thing. It is not. Sort it by what it does and you get 5 types. You already use most of them every day. Let me show you where.\"\n\n(Next) Predictive AI, built on machine learning: \"Think of a weather forecast, but for your sales. When Grab tells you the driver arrives in 4 minutes, or your bank sends a fraud alert, or Shopee picks products for you, that is predictive AI. It learns from past numbers and guesses the next one: here, December, 1,240 cartons. In your company: who will pay late, what will run out. Its limit: a new product has no history.\"\n\n(Next) Vision AI, built on deep learning: \"You see this every day at the car park. The car rolls up, the camera reads WXY 1234, checks the season pass, and the barrier lifts. No ticket, no guard. Face unlock and Google Lens work the same way. In your company: reading a handwritten order or a bank slip. Dirty plate, bad light: it can misread.\"\n\n(Next) Voice AI: \"Hey Siri, YouTube captions, talking to your car. It turns sound into text. Your customer sends a voice note: Boss, esok hantar 10 carton Milo. It types it out, and it becomes an order line. A noisy shop or heavy slang, and it mishears sometimes.\"\n\n(Next) Diffusion AI, built on a diffusion model: \"Have you watched those AI short dramas on TikTok or YouTube? Many of them were never filmed. You type 1 line: the boss finds out his clerk is an AI. It starts from pure noise, like TV static, and cleans it a little at every step. Step 25, you can see a city. Step 50, done: episode 1. Midjourney and Sora work the same way. In your company: product photos and promo videos, without a studio. Hands, faces and words can still come out wrong, so check before you post.\"\n\n(Next) AI Agent, the LLM plus tools: \"This one does the work. 1 WhatsApp order: it reads it, checks the stock in SQL Account, drafts the Sales Order, and then waits for you. An agent uses the other 4 as its eyes, ears and voice. That is what today is about.\"\n\nThis slide has 5 extra Next presses; each card flies in, in 3D, and plays its own short scene.\nNext: \"The brain behind ChatGPT and every AI agent is the LLM. Let's open it up.\"",

 {
  "file": "slides/10-how-much-it-read.html",
  "label": "How much an AI has read",
  "section": "What is an AI Agent?",
  "notes": "\"ChatGPT, Claude, Gemini, DeepSeek. You know the names. Inside each one is the same thing: an LLM, a large language model. Large, because it was trained on a huge amount of data: websites, books, news, in more than 100 languages. Language, because words go in and words come out. Model, because it learned the patterns of how people write, so it can guess the next word, 1 at a time. It reads text in small pieces called tokens; 1 token is about three quarters of a word.\"\n\n(Next) \"Quick guess. To learn language, how much did it read? A, 10,000 books. B, 1 million. C, 20 million. D, 100 million. Stacked up, A is a 70-storey tower. B is 6 Mount Kinabalus. C goes past the space station. D is 6 times higher than the space station. If you read 1 book a day, A takes you 27 years. D takes you 274,000 years. Raise your hand: A? B? C? D?\" (count the hands, then Next)\n\n(Next) \"Who said D? Still not enough. Take DeepSeek V4, from 2026: about 240 million books of 400 pages, more than 2 times D. In tokens, those small pieces of text, that is more than 32 trillion. 2 years earlier, Llama 3 read 15 trillion, about 110 million books, so it doubled in 2 years.\n\nWatch: if you stacked the books...\" (the pile reaches the top of the Twin Towers) \"...that is 1 Twin Tower. Keep going.\" (the view pulls back) \"13,000 Twin Towers. The pile is about 6,000 km tall, 15 times higher than the space station. Laid flat, the books would cover 800 football fields.\" (the view changes to Earth and Moon) \"And if you tore out every page and laid them end to end, they would reach the Moon 50 times over.\"\n\nNote: rough figures from the published token counts (DeepSeek-V4 paper: 32T+ tokens; Meta: Llama 3, 15T+). Working: 1 token = 0.75 word; a 400-page book = 100,000 words, 2.5 cm thick, 12 x 20 cm pages; a football field = 7,140 m2. Say \"about\". The stack itself does not reach the Moon; the pages laid end to end do.\nThis slide has 2 extra Next presses: the LLM intro, the guess (A to D; the real answer is even bigger than D), then the 32 trillion scene.\nNext: \"So it is a very clever brain. But can it do your work? Not on its own.\"",

 {
  "file": "slides/13-what-is-agent.html",
  "label": "What is an AI agent?",
  "section": "What is an AI Agent?",
  "notes": "\"A brain alone only talks. So, step by step, people gave it more: tools in 2023, and from 2025 agents that work on their own. If the LLM is the brain, an AI agent is the brain with hands, and with limits. Here it is as a robot with 5 parts. A brain alone only talks; it tells you what to do. Give it the other 4 parts and it does the work for you. Let me take them 1 at a time.\"\n\n(Next) Brain: \"The head is the language model. It understands the message and plans the next step. It understands meaning, not keywords: bwg, bawang and onion are the same thing. Here it reads big onions, 10 kg bags, and sees the quantity is missing, so it asks. But on its own it has never seen your company. Like a smart graduate on day 1.\"\n\n(Next) Tools: \"The hands, and the part people forget. Each tool is 1 action in a real system. Some tools only look: check stock, read an invoice. Some tools act: create an order, send a message. The brain cannot click a button. Without tools, it can only tell you what to do. No tools, no work.\"\n\n(Next) Memory: \"The filing cabinet in its chest. Most people do not know this: the brain forgets everything after each chat. So it looks things up in your records: customers, prices, stock, fresh every time. Jaya Grocer's last price for big onions: RM28 a bag. Which also means: messy records in, wrong answers out.\"\n\n(Next) Rules and skills: \"The rulebook in its hand. Your way of working, written down. Rules say what must never happen: over the credit limit, stop and ask the boss. Skills are the steps for 1 job: read the order, match the items, check stock, draft, send for approval. Plain words, so your manager can read and change them.\"\n\n(Next) Permission: \"The badge on its chest, and what makes it safe. What can it see? Only the data its job needs. What can it do? Only what you allow: draft yes, delete no, move money never. And anything important waits for a person, and every action is logged. This is the difference between a helper and a risk.\"\n\n(Next) \"Put the 5 together on 1 WhatsApp order: the brain reads it, memory finds the customer and the stock, the tools draft the order in your ERP, the rules make it ask when an item is unclear, and permission means you approve before anything is saved.\"\n\nThis slide has 6 extra Next presses: the 5 parts, then 1 order.\nNext: \"But not every agent is a good agent. Meet 2 of them.\"",

 {
  "file": "slides/14-good-vs-bad-agent.html",
  "label": "Good agent vs bad agent",
  "section": "What is an AI Agent?",
  "notes": "\"Now, not every agent is a good agent. Meet 2 of them. Ah Malas, with his coffee: he only does what you type. And Ah Rajin: he sees the work and starts it before you ask. Same AI inside. Very different staff. Let's follow them through 1 day.\"\n\n(Next) 9 am: \"3 WhatsApp orders come in. Ah Malas? Zzz. Nothing happens until you sit down and type: create the orders. Ah Rajin has already drafted 3 Sales Orders: Boss, approve?\"\n\n(Next) 11:30: \"Milo stock is down to 2 days. Ah Malas says nothing; you find out when a customer shouts at you. Ah Rajin: Milo runs out on Friday, and the PO to the supplier is already drafted.\"\n\n(Next) 4 pm: \"Kedai Ali is 45 days late. Nobody asked Ah Malas, so he never reminds. Ah Rajin sends a polite reminder and comes back with: RM3,200 promised by Friday.\"\n\n(Next) \"By 5 pm, Ah Malas did 1 job: the 1 you typed. Ah Rajin did 5, all waiting for your OK. And here is the important part: Ah Rajin is still not allowed to post anything on his own. Proactive does not mean out of control. It means he does the preparing, and you do the deciding.\n\nSo what makes a good agent? It knows the goal, it watches your data, it acts first, and it still asks you. That is how we set up every SuDu agent.\"\n\nThis slide has 4 extra Next presses: 3 moments of the day, then the score.\nNext: \"How do you turn the brain into a good staff member? The same way you set up a new hire.\"",
  "steps": 4,
  "thumb": "thumbs/14-good-vs-bad-agent.jpg"
 },
 {
  "file": "slides/15-brain-to-staff.html",
  "label": "From brain to staff member",
  "section": "What is an AI Agent?",
  "notes": "\"A brilliant brain alone only talks. Think about hiring a brilliant graduate: talent is not enough. You give them 6 things, and an AI Agent needs the same 6.\n\n[Go down the list] A job description: for the AI, its instructions: the goal, and when the job counts as done. Without it, it does too much, or the wrong job. Logins and keys: its tools, 1 for each action. Without them, it can only give advice. The files: its memory: your records, and what you taught it. Without it, it forgets the customer and guesses the price. Your SOP: its rules and skills. Without them, it does the job its own way. A supervisor: permission, who says yes. Without it, nobody checks before stock or money moves. And probation: testing. You try it on last month's orders first, then you watch it. Without that, the same mistake repeats quietly.\n\nThe brain plus this setup has a name: the harness. Every company can rent the same brain. The harness decides whether it helps or hurts.\"\n\nNext: \"Now, let me ask you to imagine something.\"",

 {
  "file": "slides/18-vision.html",
  "label": "Our vision",
  "section": "SuDu AI",
  "notes": "(Let the line land. Pause for two seconds before speaking.)\n\n\"Our vision at SuDu is to build an AI that runs a company on its own. Not a chatbot. Not a report. An AI that runs the operation. Look at the sphere: every point is a job in your company. Order, buy, receive, store, make, ship, bill, collect, and all the jobs around them: quote, credit check, pick, pack, count, plan, quality check, pay the supplier, report. Every one is connected, and the work keeps moving around it on its own.\n\nThat is why SuDu is the AI ERP built for this, to serve businesses: 1 system runs every process, AI executes, analyses and reminds, and people make the decisions. Most software adds AI on top: a chatbot sits beside the old system, and people still key in, click and chase. We built the system itself for AI, so it can read every order, every stock count and every payment, decide, and do the work, with people approving what matters. And the last step is physical: robots that move, pick and count, run by the same system.\n\nThat is where we are going. Let me show you what it looks like today.\"\n\nNext: the map.",

 {

  "notes": "\"First, the big picture, in plain words.\n\nThe big box is SuDu: one ERP, one system, one database. Inside it the work flows left to right. Supply chain: selling and buying, so orders are in one place. The warehouse, WMS: every carton is scanned, so stock is accurate. The factory, MES: every job is tracked, so you can see every job. And finance: everything goes into SQL Account, so your accounts are always up to date.\n\nOn the left, customers and suppliers reach the system the way they already work: WhatsApp and email. Across the top, the AI agents read everything and do the work at every step. At the bottom, the next step: physical AI, an auto-driving truck and a humanoid robot, run by the same system.\n\nWatch one order travel through it.\" (It loops by itself, about 17 seconds.)\n\nNote: physical AI is the roadmap, not on sale today.\nNext: \"Every company is walking the same road. Where is yours?\"",

 {
  "file": "slides/20-five-stages.html",
  "label": "5 stages",
  "section": "SuDu AI",
  "notes": "\"Think about the industrial revolutions: steam, then electricity, then computers. Each one changed who did the work, and the factories that moved first won. The same thing happens in how a company is run.\n\nBusiness 1.0, until about 1980: handwritten. Orders in a book, stock counted by hand. Slow, and nobody sees the whole picture.\n\nBusiness 2.0, the 1980s and 1990s: spreadsheets. Excel files passed around by email. Faster, but many versions and typing mistakes.\n\nBusiness 3.0, from the 1990s until now: software. SQL Account, and a separate system for each team. Much better, but the systems do not talk, and people still key everything in. This is where most companies in this room are today.\n\nBusiness 4.0 is already here. ChatGPT arrived at the end of 2022 and could only talk. Since 2025, AI agents do the work: they read the WhatsApp order, create the documents, chase the payment, inside an AI-native ERP, and people approve. That is what SuDu does today, and what you will see in the demo.\n\nAnd business 5.0 is next: physical AI. Humanoid robots and self-driving trucks do the physical work, run by the same system. AI-native ERP plus robots: the autonomous enterprise.\n\n(Pause while the competitor marker climbs.) Here is the point. The future is not coming; it is here. Your competitor can already be at 4.0 while you are at 3.0, and in every revolution so far, the ones who moved first took the customers. The gap grows every year.\"\n\nPoint at the two bars on each card: manual work and cost fall with every era, and fall the most at 4.0 and 5.0.\nNote: the years are rounded eras, not exact dates; the manual-work and cost bars are an illustration, not measured figures. Physical AI timing (late 2020s) is an outlook, and it is not on sale today.\nNext: \"Now let's look at how SuDu is built, from the side.\"",

 {
  "file": "slides/24-top-5-issues.html",
  "label": "Top 5 issues",
  "section": "The problem",
  "notes": "\"While your answers come in, here are the five problems we hear in almost every company we visit.\n\nOne: orders typed in by hand. Every WhatsApp and email order is keyed in again, and it takes a team of people to do it.\n\nTwo: routine work done by people. Chasing overdue payments, sending statements, checking the same reports every morning.\n\nThree: problems found too late. Sales drop, a good customer stops ordering, stock runs out, and nobody notices until it hurts.\n\nFour: stock that is never right. The system says forty cartons, the shelf has twelve.\n\nAnd five: cash comes in late. The invoice goes out days after the delivery, and the bank slip is lost somewhere in the chat.\n\nPut your hand up if you have at least three of these.\" (Pause.)\n\nDo: let the hands go up; it is the same point the poll will make with data.\nNote: issue 5 is our suggestion; swap it for the room's top answer if the poll shows something else.\nNext: \"Let me show you how problem number one starts.\"",

  "file": "slides/25-guess-the-order.html",
  "label": "Guess the order",
  "section": "The problem",
  "notes": "\"This is a real order, from a real customer chat. Read it with your table: what exactly did this customer order? You have twenty seconds.\" (Pause, let two tables answer.)\n\n(Next: the question marks appear.) \"China: is that a heading, a brand, or where the onions come from? Bwg besar, ten kilo, times what? How many bags? Ayam cincang, eight ekor, times how many? Twenty-five mil clear, one piece: which item is that in your system, which code? And deliver before twelve: which day?\n\nNobody outside your office could decode this. But somebody inside your office does it, for every order, every day: opens the chat, guesses, checks the last order, looks up the codes, and types it into SQL Account.\"\n\n(Next: a PDF purchase order slides in.) \"Some customers are neater. They send a PDF purchase order. Better, but somebody still has to match their stock code to yours, check the price and the unit, a bag of ten or one, and key every line into SQL Account. Then the next PO.\" (The PO is a mock-up with made-up names.)\n\nThis slide has 2 extra Next presses: the questions, then the PDF.\nNext: \"And that same order gets typed again, and again.\"",
  "steps": 2,
  "thumb": "thumbs/25-guess-the-order.jpg"

 {
  "file": "slides/26-typed-three-times.html",
  "label": "Keyed in by hand",
  "section": "The problem",
  "notes": "\"Follow one order once it is decoded. It comes in by WhatsApp, PDF or a phone call, about 80 a day in a typical distributor. Then a person keys it into SQL Account: new sales order, customer, then line by line, field by field: item code, quantity, unit, price. About 4 minutes an order.\n\nThen the store needs a picking list. The order is already in SQL Account, but in many companies someone types it again into Excel: item, quantity, which rack. Print, pick, pack. Another 2 minutes.\n\nAdd it up: 80 orders times 6 minutes is 8 hours a day. That is 1 full-time person who only types. And because the same order is typed twice, there are 2 chances for a wrong code or 10 pieces read as 10 cartons.\n\nYour books are right; SQL Account does its job. The trouble is all the typing around the books. It is nobody's fault; it is how the work was set up.\"\n\nDo: point at each card as you say it. Note: 80 orders, 4 and 2 minutes are an example; ask the room for theirs.\nNext: \"Problem two: the routine work.\"",

  "notes": "\"Problem two. Look at this list. Check who is overdue. Send fifteen payment reminders on WhatsApp. Match the bank slips to the invoices. Send statements. Check the stock. Put the sales report together. Somebody in your office does this every day. And tomorrow, the list starts again. None of it needs a decision. All of it needs a person, today.\"\n\nNext: \"Problem three is worse, because you don't see it.\"",

 {

  "section": "The problem",
  "notes": "\"Problem three: problems you find too late. This is a sample customer. Every week, nine or ten cartons. Then the orders get smaller, and then they stop. Maybe a competitor called him. Nobody in the office notices, because nobody is watching every customer every week. Seven weeks later someone asks, whatever happened to Ah Seng? By then he is gone. Same with stock: you find out it ran out when the customer calls. Same with sales: you see the drop in the month-end report, a month after it started.\"\n\nNote: sample data, say so.\nNext: \"Problem four: your stock figures.\"",
  "thumb": "thumbs/28-problem-3.jpg"
 },
 {
  "file": "slides/29-problem-4.html",
  "label": "Problem 4: stock never right",
  "section": "The problem",
  "notes": "\"Problem four: stock. SQL Account says forty cartons. Somebody walks to the shelf: twelve. Where did twenty-eight go? Here is what really happens in most warehouses.\n\nManual picking: picking is done on paper, so the wrong item or quantity goes out and nobody updates the system. There is no fixed shelf spot, so goods are left wherever there is space and nobody records which shelf. So stock cannot be found: it is in the warehouse, but nobody knows where. The oldest stock is not sent first, so the old cartons sit at the back and expire. UOM mixed up: pieces get keyed as cartons. And everything is typed in the next day.\n\nWhat does it cost? You promise stock you don't have. Expired stock is thrown out. Staff spend hours searching. And the warehouse stops for a day at every month-end count.\n\nHands up if your stock count never matches the system.\" (Pause.) \"If you don't trust the number, you can't let a person, or an AI, promise stock to a customer.\"\n\nNext: \"And problem 5, the one that hurts the most: cash.\"",
  "thumb": "thumbs/29-problem-4.jpg"
 },
 {
  "file": "slides/30-problem-5.html",
  "label": "Problem 5: cash comes in late",
  "section": "The problem",
  "notes": "\"Problem five: cash. The goods are delivered on day zero. The invoice is typed and sent on day three, because the office is behind. Payment is due a month later, and the customer forgets. Someone chases. The money arrives on day sixty-three, and the bank slip is sitting somewhere in a WhatsApp chat until somebody matches it. For two months, your money is in your customer's bank, and you are paying salaries and suppliers in the meantime.\"\n\nNote: sample timeline; use the room's real payment terms if you know them.\nNext: \"So what do all five problems cost you? Let's count it, with your own numbers.\"",
  "thumb": "thumbs/30-problem-5.jpg"

 {
  "file": "slides/31-count-your-number.html",
  "label": "Count your own number",
  "section": "The problem",
  "notes": "\"Let's put a number on all five problems, your own number. Three steps.\n\nStep one: how many hours a week does your team spend on manual work, all staff added together? In my example: keying in orders ten hours, chasing payments eight, checking stock seven. Twenty-five hours a week.\n\nStep two: times fifty-two weeks in a year.\n\nStep three: times sixteen ringgit, roughly what one staff hour costs you with EPF and SOCSO.\n\nTwenty-five times fifty-two times sixteen: twenty thousand eight hundred ringgit a year, spent on typing and chasing. Now work out your rough monthly staff cost and write it in your notes.\"\n\nDo: one minute of silence. Coaches help with the sums.\nNote: RM16 an hour is a staff member at about RM3,400 a month all-in, over 208 working hours. Adjust for your audience.\nNext: \"The usual answer is to hire another clerk. That only puts more people on the same typing. Can an AI Agent fix it? Only if it has 1 thing: tools.\"",
  "thumb": "thumbs/31-count-your-number.jpg"
 },
 {

  "label": "AI without tools",
  "section": "The problem",
  "notes": "\"Quick question. Once you start using AI, are these problems solved?\" (let the room answer; most will say yes)\n\n(Next) \"Not necessarily. AI on its own can think. It cannot do.\"\n\n(Next) \"Here is the catch. AI without tools is just a guru. You know the type: very confident, very good advice. You should check your stock first. You should chase Kedai Ali. You should key in your orders faster. Thank you, guru.\" (pause) \"In Chinese we have a phrase for this: 只会讲，不会做. All talk, no action.\" (let the room laugh)\n\n\"AI is the same. On its own, it can only think and suggest. To actually do the work, it needs tools: hands inside your business. That is what SuDu gives it. WMS for the warehouse: it scans, counts and picks your stock. MES for the factory: it tracks every job and every batch. All on top of SQL Account, where your orders, invoices and payments already live. Now the AI checks, counts, keys in and chases, and you approve.\"\n\nThis slide has 2 extra Next presses: the question, then \"Not necessarily\", then the Guru.\nNext: \"So with tools, the way we work changes.\"",

  "section": "The problem",
  "notes": "\"So with tools, the way we work changes. The AI Agent does the work: it thinks, it reads the order and plans every step, and it executes: checks the stock, keys in, sends, chases.\n\nAnd you? You run the rules. You set them: credit limits, prices, who approves what. You monitor: every action on 1 screen. And you approve: nothing is posted without you. Rules go to the AI, reports come back to you.\n\nBefore, people did the work and software kept the records. Now, AI does the work, and people run it. That is a new way of working.\"\n\nNext: \"And the part that makes this possible is the tools.\"",

  "notes": "\"So an AI Agent needs a proper system with real buttons. In the warehouse, that system is SuDu WMS. It covers 3 jobs.\n\nOne, supply chain: when stock runs low, the AI raises the Purchase Request, you approve, and the PO goes to the supplier.\n\nTwo, inventory: goods in, goods out and the stock count, all scanned on the mobile app, with every batch tracked.\n\nThree, basic production: build finished goods from a BOM, and the stock updates itself.\n\nAnd everything posts straight to SQL Account, so the accounts always match the warehouse.\"\n\nNext: \"Let me walk you through each flow, starting with buying.\"",

 {
  "file": "slides/41-why-sudu.html",
  "label": "Why SuDu if I have SQL Account",
  "section": "SuDu AI",
  "notes": "\"(The question fills the screen. Let it sit.) Here is the question I hear most: I already have SQL Account, why do I need SuDu?\" (Next: the answer appears.) \"Good question, because SQL Account is excellent. Think of your company in layers.\n\nLayer one, the foundation, is accounting. SQL Account keeps your accounts: invoices, payments, tax, reports. But notice: it records what has already happened.\n\nLayer two is the warehouse. A warehouse system runs the floor: every carton is scanned when it arrives, goes on a shelf, is picked and is shipped. The stock moves are recorded the moment they happen, so your stock figure is real and accurate.\n\nLayer three, if you manufacture, is the factory: MES, a manufacturing execution system. It plans each job, issues materials against the BOM, and records output, scrap and machine time as they happen. So at any moment you can see where every job is, whether it is late, and what it really cost. No more waiting for the paper logsheet tomorrow. You can see every job.\n\nAnd layer four sits on top: the AI agents. They read all three layers and do the work: take orders, buy stock, chase payments, spot problems early, and people approve. SQL Account tells you what already happened. SuDu runs what happens next.\"\n\nNext: \"So can I just connect ChatGPT or Claude to SQL Account myself? Here is a question I get every week.\"",

 {
  "file": "slides/42-plug-straight-in.html",
  "label": "Why not plug it straight in?",
  "section": "SuDu AI",
  "notes": "\"Every week someone asks me: can I just connect Claude or ChatGPT to my SQL Account? You can. There are 3 ways, so let's compare them honestly.\n\nWay 1: do it yourself. A programmer wires Claude straight into the database. It only works when you ask it. It writes straight into the tables and skips SQL Account's own checks, there is no approval and no log, and it lives on a programmer's laptop. You pay the programmer and the AI subscription.\n\nWay 2: a connector. A plug-in that lets Claude or ChatGPT talk to SQL Account. This is a proper product: it uses SQL Account's own login, and you approve orders. Apart from a daily briefing, it mostly works when someone asks it something. It covers accounting only, and it runs on 1 office PC that must stay switched on. And the costs add up: the licence, an AI subscription, and often extra SQL Account user licences, because every staff member needs their own SQL Account login.\n\nWay 3: SuDu AI. AI staff that work on their own every day: chasing payments, sending reports, taking orders. It keeps SQL Account's rules, everything waits in an approval queue and is logged. It covers accounting, warehouse and factory. It runs in the cloud, on web, mobile and WhatsApp. And it is 1 price, with the AI included.\n\nClaude and ChatGPT are great brains. With SuDu you get the brain, the ERP and the AI staff, all in 1 price.\"\n\nNote: keep it fair: do not name any connector product. Claude is made by Anthropic, ChatGPT by OpenAI.\nNext: \"Let me go 1 level deeper.\"",
  "thumb": "thumbs/42-plug-straight-in.jpg"
 },
 {
  "file": "slides/43-plug-deep.html",
  "label": "Under the hood: connector vs SuDu",
  "section": "SuDu AI",
  "notes": "\"Let me go 1 level deeper, because this is where the difference really shows. A connector lets you chat with your data. SuDu runs your company. 6 things.\n\nWhatsApp. A connector cannot read WhatsApp groups, and it only knows a customer if their phone number matches the mobile in SQL Account. SuDu reads group and private chats by itself, even from numbers nobody saved, and it matches the nicknames customers use for items.\n\nOrders. With a connector, your staff still key in orders 1 at a time; customer self-service is a paid add-on. In SuDu, a customer's WhatsApp order becomes a Sales Order draft, and you just approve.\n\nFollow-up. A connector's scheduled message fires once and is done: it does not wait for the reply, and it does not stop when the customer pays. SuDu is rolling out tasks that run for days: send, wait, follow up, stop when paid.\n\nMemory. A connector reads SQL Account live for each question. SuDu has a memory layer: every customer's history, habits and past chats, across millions of records.\n\nIf it goes down. A connector lives on 1 Windows PC that must always be on. Everything sits on 1 disk: no backup, and nobody is alerted when it stops. SuDu runs in the cloud, monitored, with alerts. And SuDu is moving big questions onto its own data platform, so your SQL Account server, which runs on Firebird and is built for bookkeeping, stays fast for your staff.\n\nSetup. A connector needs on-site IT, there is no mobile app, the admin page only opens on that PC, and the licence is tied to that PC. SuDu: sign in on web or mobile, and run several companies in 1 account.\"\n\nNote: the data platform and multi-day tasks are rolling out; say \"is moving\" / \"is rolling out\", not \"already\". Keep it fair: no connector product is named.\nNext: \"So AI needs something underneath it.\"",
  "thumb": "thumbs/43-plug-deep.jpg"
 },
 {
  "file": "slides/44-the-house.html",
  "label": "What AI needs underneath",
  "section": "SuDu AI",
  "notes": "\"AI is like a house. Most people only look at the roof. The AI is the exciting part. But a roof needs a house under it, and AI on messy data only makes mistakes faster. So build from the foundation up. For each level, 1 risk and 1 question to check yourself.\n\n1, the foundation: clean data. 1 code per item, fixed units, and stock that matches the shelf because every carton is scanned and every job recorded. Without it, the AI quotes the wrong price and promises stock you do not have. Check: when you count, does the system match the shelf?\n\n2, the door: a safe connection. The AI goes through a controlled door that keeps your accounting rules, never straight into the database. Without it, 1 wrong command can freeze the server or break your accounts. Check: does any tool write straight into your SQL database?\n\n3, the walls: permissions and approvals. Who may see what, do what, and say yes, with every action logged. Without them, the AI can change anything, and nobody knows who did what. Check: is it written down who approves discounts, credit and purchases?\n\n4, the roof: the AI Agents doing the daily work. Without them, people keep typing and chasing by hand. Check: which job eats the most hours each week?\n\nFor the next part, I will show you the whole house, working.\"\n\nThe house builds itself from the ground up; the numbered dots match the 4 levels. This is thread 2; it returns later in the deck.\nNext: \"Before the demo, 1 picture every admin in this room will understand.\"",

  #stage { position: fixed; top: 50%; left: 50%; transform-origin: top left; will-change: transform; background: #021A17; box-shadow: 0 10px 60px rgba(0,0,0,0.4); overflow: hidden; }

  #stage iframe.live { opacity: 1; z-index: 1; }
  #stage iframe.prev { opacity: 1; z-index: 0; transition: none; }
  /* zoom transition: overview map <-> detail map */
  #stage iframe.zout { z-index: 2; animation: zout .9s cubic-bezier(.55,0,.25,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zin  { animation: zin .9s cubic-bezier(.2,.7,.2,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zback { z-index: 2; animation: zback .8s cubic-bezier(.55,0,.25,1) forwards; transform-origin: 62% 55%; }
  #stage iframe.zret  { animation: zret .8s cubic-bezier(.2,.7,.2,1) forwards; transform-origin: 62% 55%; }
  @keyframes zout  { from { transform: scale(1); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes zin   { from { transform: scale(.88); opacity: 0; } 35% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  @keyframes zback { from { transform: scale(1); opacity: 1; } to { transform: scale(.85); opacity: 0; } }
  @keyframes zret  { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .counter { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; z-index: 100; opacity: 0.7; }
  .counter .label { color: rgba(255,255,255,0.7); margin-left: 8px; }
  .overview-btn { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.85); border: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-family: inherit; cursor: pointer; z-index: 100; opacity: 0.6; }
  .overview-btn:hover { opacity: 1; }
  .nav-zone { position: fixed; top: 0; bottom: 0; width: 15%; cursor: pointer; z-index: 50; }
  .nav-zone.left { left: 0; } .nav-zone.right { right: 0; }
  .nav-hint { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 22px; opacity: 0; transition: opacity .2s; }
  .nav-zone.left .nav-hint { left: 20px; } .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    body[data-mode] .overview { display: none !important; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone, .overview-btn, .start-btn { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe { width: 1920px; height: 1080px; page-break-after: always; display: block; }
  }

  /* SuDu additions: progress hairline, speaker notes, quiet chrome */
  #progress { position: fixed; left: 0; top: 0; height: 3px; background: #00F5A9; box-shadow: 0 0 10px rgba(0,245,169,.7); z-index: 120; transition: width .5s cubic-bezier(.16,1,.3,1); }
  body[data-mode="overview"] #progress { display: none; }
  #present-ui .counter, #present-ui .overview-btn { transition: opacity .4s; }
  body.idle #present-ui .counter, body.idle #present-ui .overview-btn { opacity: 0; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; overflow: auto; background: rgba(2,26,23,.94); color: #E8F5EF; z-index: 150;
    padding: 22px 32px 26px; font: 17px/1.55 -apple-system, "Helvetica Neue", sans-serif; white-space: pre-wrap; transform: translateY(100%); transition: transform .35s cubic-bezier(.16,1,.3,1);
    border-top: 2px solid #00F5A9; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #notes b { display: block; font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; color: #00F5A9; margin-bottom: 12px; text-transform: uppercase; }
  body.notes #notes { transform: none; }
  @media print { #progress, #notes { display: none !important; } }
</style>
</head>
<body data-mode="overview">

<div id="ov-grid" class="overview">
  <div class="overview-title">Hire Your First AI Agent · click any slide to present · N notes · Esc overview</div>
  <div class="wall-wrap"><div class="wall" id="wall"></div></div>
</div>

<div id="ov-gallery" class="overview">
  <div class="stage3d"><div class="breathe"><div class="drift-layer" id="driftLayer"><div class="gallery" id="gallery"></div></div></div></div>
  <div class="vignette"></div>
  <div class="overview-title">Hire Your First AI Agent · click any slide to present</div>
</div>

<button class="start-btn" id="startBtn">▶ Present</button>

<div id="present-ui">
  <div id="stage"><iframe id="frame" class="live" src="about:blank"></iframe><iframe id="frame2" src="about:blank"></iframe></div>
  <button class="overview-btn" id="overviewBtn">⊞ Overview</button>
  <div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
  <div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
  <div class="counter" id="counter">1 / 1</div>
</div>

<div class="print-stack" id="printStack" style="display:none;"></div>
<div id="progress"></div>
<div id="notes"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const CARD_W = window.GALLERY_CARD_W || 300;
  const DRIFT_SEC = window.GALLERY_DRIFT_SECONDS || 80;
  const stage = document.getElementById('stage');
  const frames = [document.getElementById('frame'), document.getElementById('frame2')];
  let liveF = 0, wantFile = null;
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const wall = document.getElementById('wall');
  const gallery = document.getElementById('gallery');
  const driftLayer = document.getElementById('driftLayer');
  const storageKey = 'deck-index-' + location.pathname;
  let current = 0;

  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  driftLayer.style.setProperty('--driftSec', DRIFT_SEC + 's');

  // 概览模式：URL ?ov= > window.DECK_OVERVIEW > 随机(秒%5==0 → 20% 画廊)
  const qp = new URLSearchParams(location.search).get('ov');
  // 用户未指定时按秒数随机：网格(iframe 真页面) 60% / 无限画廊(图片缩略图) 40%。可用 ?ov=grid|gallery 或 window.DECK_OVERVIEW 固定。
  const OVERVIEW = qp || window.DECK_OVERVIEW || ((new Date().getSeconds() % 5 < 2) ? 'gallery' : 'grid');
  document.body.setAttribute('data-ov', OVERVIEW === 'gallery' ? 'gallery' : 'grid');

  function setMode(mode) {
    document.body.setAttribute('data-mode', mode);
    if (mode === 'present') { fit(); show(current); }
    else { requestAnimationFrame(buildOverview); }
  }

  /* ─ 媒体（缩略图优先，否则 iframe） ─ */
  function makeCard(idx, useScale, useImg) {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.idx = idx;
    const item = deck[idx];
    if (useImg && item.thumb) {
      // 仅画廊用：预渲染缩略图，扛无限平铺的性能
      const im = document.createElement('img');
      im.className = 'thumb-img'; im.src = item.thumb; im.decoding = 'async';
      card.appendChild(im);
    } else if (useImg) {
      // no picture yet: a plain title card. Never load many live slides at once (heavy, flickers)
      const ph = document.createElement('div');
      ph.className = 'thumb-img';
      ph.style.cssText = 'display:grid;place-items:center;padding:14px;text-align:center;color:#A9C4BA;font:600 15px/1.35 -apple-system,sans-serif';
      ph.textContent = item.label || ('Slide ' + (idx + 1));
      card.appendChild(ph);
    } else {
      // 网格默认用：真实 HTML 子页面（清晰、所见即所得）
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (useScale != null) thumb.style.transform = 'scale(' + useScale + ')';
      const ifr = document.createElement('iframe');
      ifr.src = item.file; ifr.setAttribute('scrolling', 'no');
      thumb.appendChild(ifr); card.appendChild(thumb);
    }
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = (idx + 1) + (item.label ? ' · ' + item.label : '');
    card.appendChild(num);
    card.addEventListener('click', () => { current = idx; setMode('present'); });
    return card;
  }

  function buildOverview() {
    if (document.body.getAttribute('data-mode') !== 'overview') return;
    if (OVERVIEW === 'gallery') buildGallery(); else buildGrid();
  }

  /* ════════ 网格墙（自适应） ════════ */
  function buildGrid() {
    const n = deck.length; if (!n) return;
    wall.innerHTML = '';
    for (let i = 0; i < n; i++) wall.appendChild(makeCard(i, null, true));  // thumbnails: no live slides in the overview
    layoutWall();
  }
  const GRID_PAD = 74;  // #ov-grid scroll 顶部 padding，算动态 transform-origin 用
  function layoutWall() {
    const n = deck.length; if (!n) return;
    const vw = innerWidth, vh = innerHeight, gap = 26;
    const availW = vw * 0.86;                                   // 留 rotateZ 横向余量（强对角也不裁切）
    const target = 280;
    let cols = Math.max(3, Math.min(9, Math.floor((availW + gap) / (target + gap))));
    cols = Math.min(cols, n);
    const rows = Math.ceil(n / cols);
    const cardW = Math.min(target + 40, (availW - (cols - 1) * gap) / cols);
    const cardH = cardW * 9 / 16;
    const baseW = cols * cardW + (cols - 1) * gap;
    const wallH = rows * cardH + (rows - 1) * gap;
    wall.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    wall.style.gap = gap + 'px';
    wall.style.width = baseW + 'px';
    // 单平面(无 preserve-3d)→任意角度都不重叠、可点；fit 与 scroll 都给强对角倾斜
    if (wallH <= vh * 0.80) {
      document.body.setAttribute('data-grid', 'fit');
      const rx = Math.max(11, Math.min(15, 15 - (rows - 2) * 1.1));
      const rz = Math.max(8, Math.min(11, 11 - (rows - 2) * 0.7));
      wall.style.setProperty('--rx', rx); wall.style.setProperty('--rz', rz);
      wall.style.transformOrigin = 'center center';
      const tilt = 'rotateX(' + rx + 'deg) rotateZ(-' + rz + 'deg)';
      wall.style.transform = tilt;
      const r = wall.getBoundingClientRect();
      let s = Math.min(vw * 0.92 / r.width, vh * 0.80 / r.height);
      s = Math.max(0.6, Math.min(s, 1.6));
      wall.style.transform = 'scale(' + s + ') ' + tilt;
    } else {
      // 多页：舒适大小竖向滚动 + 强对角倾斜；transform-origin 跟随滚动→消除高墙 rotateZ 把远端行甩出屏幕
      document.body.setAttribute('data-grid', 'scroll');
      wall.style.setProperty('--rx', 14); wall.style.setProperty('--rz', 7);
      wall.style.transform = 'rotateX(14deg) rotateZ(-7deg)';
      updateScrollOrigin();
    }
    wall.querySelectorAll('.card .thumb').forEach(t => { const c = t.parentElement; if (c.clientWidth) t.style.transform = 'scale(' + (c.clientWidth / W) + ')'; });
  }
  function updateScrollOrigin() {
    if (document.body.getAttribute('data-grid') !== 'scroll') return;
    const ovg = document.getElementById('ov-grid');
    wall.style.transformOrigin = '50% ' + (ovg.scrollTop + window.innerHeight / 2 - GRID_PAD) + 'px';
  }

  /* ════════ 无限画廊（洗牌不重复） ════════ */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffledRange(n, seed) { const rnd = mulberry32(seed); const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }

  function buildGallery() {
    const n = deck.length; if (!n) return;
    const vw = innerWidth, vh = innerHeight, gap = 18;
    const cardW = CARD_W, cardH = cardW * 9 / 16;
    const cellW = cardW + gap, cellH = cardH + gap;
    const visCols = Math.ceil(vw / cellW), visRows = Math.ceil(vh / cellH);
    // tile：宽够铺满；行数取「够铺满」与「装下全部 N 页」的较大者 → 看完所有页才重复
    const tileCols = visCols + 1;
    const tileRows = Math.max(visRows + 1, Math.ceil(n / tileCols));
    const tileCells = tileCols * tileRows;
    const perm = shuffledRange(n, 0x9e3779b9);        // 洗牌一次，打散规则感
    const tilePage = new Array(tileCells);
    for (let k = 0; k < tileCells; k++) tilePage[k] = perm[k % n];

    const cols = tileCols * 2, rows = tileRows * 2;    // 2× tile 保证无缝漂移
    driftLayer.style.setProperty('--dx', (tileCols * cellW) + 'px');
    driftLayer.style.setProperty('--dy', (tileRows * cellH) + 'px');
    gallery.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cardW + 'px)';
    gallery.style.gridAutoRows = cardH + 'px';
    gallery.style.gap = gap + 'px';
    gallery.innerHTML = '';
    const scale = cardW / W;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = tilePage[(r % tileRows) * tileCols + (c % tileCols)];
        gallery.appendChild(makeCard(idx, scale, true));  // 画廊 = 图片缩略图（性能）
      }
    }
  }

  /* ════════ 演示 ════════ */
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = 'translate(' + ((innerWidth - W * s) / 2) + 'px, ' + ((innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
    stage.style.top = '0'; stage.style.left = '0';
  }
  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    const fromIdx = current;
    current = idx;
    step = 0;
    // zoom between a slide and the one marked enter:'zoom' right after it
    const zoomIn = idx === fromIdx + 1 && deck[idx].enter === 'zoom';
    const zoomOut = idx === fromIdx - 1 && deck[fromIdx] && deck[fromIdx].enter === 'zoom';
    const file = deck[idx].file;
    if (frames[liveF].getAttribute('src') !== file && wantFile !== file) {
      wantFile = file;
      const back = frames[1 - liveF];
      back.onload = () => {
        if (wantFile !== file) return;            // a newer slide was asked for meanwhile
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const old = frames[liveF];
          const zo = zoomIn ? 'zout' : zoomOut ? 'zback' : '', zi = zoomIn ? 'zin' : zoomOut ? 'zret' : '';
          frames.forEach(f => f.classList.remove('zout', 'zin', 'zback', 'zret'));
          old.classList.add('prev'); old.classList.remove('live');
          if (zo) { old.classList.add(zo); back.classList.add(zi); }
          back.classList.add('live'); liveF = 1 - liveF; wantFile = null;
          if (document.activeElement === old) { old.blur(); window.focus(); }
          setTimeout(() => { old.classList.remove('prev', zo || 'x'); back.classList.remove(zi || 'x');
            if (!old.classList.contains('live')) old.src = 'about:blank'; }, zo ? 950 : 400);
        }));
      };
      back.src = file;
    }
    counter.innerHTML = (idx + 1) + ' / ' + deck.length + ' <span class="label">' + (deck[idx].label || '') + '</span>';
    document.getElementById('progress').style.width = ((idx + 1) / deck.length * 100) + '%';
    document.getElementById('notes').innerHTML = '<b>' + (idx + 1) + ' · ' + (deck[idx].section || '') + ' · ' + (deck[idx].label || '') + '</b>' + (deck[idx].notes || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) history.replaceState(null, '', '#' + (idx + 1));
  }
  // in-slide steps: a slide with "steps": N gets N extra Next presses before the deck moves on
  let step = 0;
  function liveFrame() { return frames.find(f => f.classList.contains('live')) || frames[0]; }
  function sendStep() { try { liveFrame().contentWindow.postMessage({ deckStep: step }, '*'); } catch (_) {} }
  function next() {
    const n = deck[current].steps || 0;
    if (step < n) { step++; sendStep(); return; }
    show(Math.min(current + 1, deck.length - 1));
  }
  function prev() {
    if (step > 0) { step--; sendStep(); return; }
    show(Math.max(current - 1, 0));
  }

  function handleKey(e) {
    if (e.key === 'n' || e.key === 'N') { document.body.classList.toggle('notes'); return; }
    if (e.key === 'g' || e.key === 'G') { setMode(document.body.getAttribute('data-mode') === 'present' ? 'overview' : 'present'); return; }
    if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); return; }
    if (e.key === 'Escape') { if (document.body.getAttribute('data-mode') === 'present') { e.preventDefault(); setMode('overview'); } return; }
    if (e.key === 'p' || e.key === 'P') { window.print(); return; }
    if (e.key === 'l' || e.key === 'L') { const zh = /(index-zh\.html|\/zh\/?)$/.test(location.pathname); const web = location.protocol !== 'file:'; location.href = (zh ? (web ? '/' : 'index.html') : (web ? '/zh' : 'index-zh.html')) + '#' + (current + 1); return; }
    if (document.body.getAttribute('data-mode') !== 'present') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); show(0); break;
      case 'End': e.preventDefault(); show(deck.length - 1); break;
      default: if (e.key >= '1' && e.key <= '9') { const i = parseInt(e.key, 10) - 1; if (i < deck.length) { e.preventDefault(); show(i); } }
    }
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    handleKey(e);
  });
  window.addEventListener('message', (m) => { if (m.data && m.data.deckKey) handleKey({ key: m.data.deckKey, preventDefault() {} }); });
  let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2200); };
  window.addEventListener('mousemove', wake); wake();
  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  document.getElementById('startBtn').addEventListener('click', () => setMode('present'));
  document.getElementById('overviewBtn').addEventListener('click', () => setMode('overview'));
  let rT;
  window.addEventListener('resize', () => { fit(); clearTimeout(rT); rT = setTimeout(() => { if (document.body.getAttribute('data-mode') === 'overview') { if (OVERVIEW === 'gallery') buildGallery(); else layoutWall(); } }, 140); });
  document.getElementById('ov-grid').addEventListener('scroll', updateScrollOrigin, { passive: true });
  window.addEventListener('hashchange', () => { const m = location.hash.match(/^#(\d+)$/); if (m) { current = parseInt(m[1], 10) - 1; setMode('present'); } });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else { try { const v = parseInt(localStorage.getItem(storageKey), 10); if (!isNaN(v) && v >= 0 && v < deck.length) current = v; } catch (_) {} }

  fit(); show(current);
  if (hashMatch) setMode('present'); else setMode('overview');



  window.addEventListener('beforeprint', () => { printStack.innerHTML = ''; deck.forEach(item => { const f = document.createElement('iframe'); f.src = item.file; printStack.appendChild(f); }); printStack.style.display = 'block'; stage.style.display = 'none'; });
  window.addEventListener('afterprint', () => { printStack.innerHTML = ''; printStack.style.display = 'none'; stage.style.display = ''; });
})();
</script>
</body>
</html>
